<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>hero stage</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* The stage for scripts/hero-video.mjs: a 1200x1000 loop for the top of the home page. The real site, rendered
     by the builder's template, in a phone and a browser; it changes template and colours by itself, and an enquiry
     comes in on WhatsApp. The last frame is the first one, so it loops without a jump. */
  :root { --plum: #3d2442; --plum-2: #24152b; --mint: #0f7a6c; --mint-2: #7fd8c8; --ink: #1d1b2e; --slate: #5d5a72; --line: #e2deec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 1000px; overflow: hidden; }
  body { background: radial-gradient(900px 700px at 70% 30%, #55325c, var(--plum-2)); font-family: Rubik, system-ui, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px); background-size: 26px 26px; }

  .live { position: absolute; top: 46px; left: 60px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font: 700 26px Rubik; }
  .live i { width: 14px; height: 14px; border-radius: 50%; background: var(--mint-2); box-shadow: 0 0 0 0 rgba(127,216,200,.7); animation: ping 1.6s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 14px rgba(127,216,200,0); } 100% { box-shadow: 0 0 0 0 rgba(127,216,200,0); } }

  .browser { position: absolute; left: 50px; top: 140px; width: 720px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); }
  .chrome { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #f1eff6; direction: ltr; }
  .chrome .d { display: flex; gap: 6px; } .chrome .d i { width: 10px; height: 10px; border-radius: 50%; background: #d4cfe0; }
  .chrome .u { flex: 1; height: 24px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font: 500 14px Rubik; color: var(--slate); display: flex; align-items: center; padding: 0 12px; }
  .bview { position: relative; width: 720px; height: 450px; overflow: hidden; }
  .bview iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform: scale(.5625); transform-origin: 0 0; }

  .phone { position: absolute; right: 64px; top: 92px; width: 340px; height: 712px; border-radius: 50px; padding: 12px; background: #0f0d12; box-shadow: 0 50px 90px -30px rgba(0,0,0,.75), 0 0 0 2px rgba(255,255,255,.08); z-index: 3; }
  .pview { position: relative; width: 316px; height: 688px; border-radius: 39px; overflow: hidden; background: #fff; }
  .pview iframe { position: absolute; top: 0; left: 0; width: 390px; height: 849px; border: 0; transform: scale(.8103); transform-origin: 0 0; }
  .notch { position: absolute; top: 20px; left: 50%; width: 96px; height: 26px; margin-left: -48px; border-radius: 14px; background: #0f0d12; z-index: 5; }

  iframe { opacity: 0; transition: opacity .5s ease; }
  iframe.on { opacity: 1; }

  .design { position: absolute; left: 70px; top: 640px; width: 600px; padding: 22px 24px; border-radius: 22px; background: #fff; box-shadow: 0 30px 60px -28px rgba(0,0,0,.6); z-index: 4; }
  .design h4 { margin: 0 0 10px; font: 700 17px Rubik; color: var(--slate); }
  .looks { display: flex; gap: 10px; margin-bottom: 18px; }
  .look { flex: 1; padding: 12px 10px; border-radius: 14px; border: 2px solid var(--line); font: 700 20px Rubik; color: var(--ink); text-align: center; transition: border-color .3s, box-shadow .3s, background .3s; }
  .look.on { border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint); background: #f2fbf9; }
  .pals { display: flex; gap: 12px; }
  .pal { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); transition: box-shadow .3s, transform .3s; }
  .pal.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--mint); transform: scale(1.06); }
  .pals.swap { animation: swap .45s ease; }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } }

  .cursor { position: absolute; z-index: 9; width: 40px; height: 40px; left: 640px; top: 900px; transition: left .55s cubic-bezier(.3,.7,.2,1), top .55s cubic-bezier(.3,.7,.2,1); filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
  .ripple { position: absolute; z-index: 8; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid var(--mint-2); background: rgba(127,216,200,.25); animation: rip .6s ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }

  .notif { position: absolute; right: 44px; top: 140px; width: 380px; z-index: 6; padding: 16px 18px; border-radius: 20px; background: #fff; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start; transform: translateY(-40px) scale(.96); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  .notif.on { transform: none; opacity: 1; }
  .notif .ic { width: 48px; height: 48px; border-radius: 12px; background: #25d366; display: grid; place-items: center; }
  .notif .ic svg { width: 28px; height: 28px; }
  .notif b { display: block; font: 700 19px Rubik; color: var(--ink); }
  .notif span { display: block; font: 400 17px/1.4 Rubik; color: #3a3650; }
  .notif em { font-style: normal; color: var(--mint); font-weight: 700; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="live"><i></i>האתר שלכם, בזמן אמת</div>

<div class="browser"><div class="chrome"><span class="d"><i></i><i></i><i></i></span><span class="u">www.your-business.co.il</span></div><div class="bview" id="bview"></div></div>
<div class="phone"><div class="notch"></div><div class="pview" id="pview"></div></div>

<div class="design" id="design">
  <h4>תבנית</h4>
  <div class="looks" id="looks"></div>
  <h4>צבעים</h4>
  <div class="pals" id="pals"></div>
</div>

<div class="notif" id="notif">
  <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.4 1.1 4.6 3 6.2L4.2 21l3.9-1.6c1.2.4 2.5.6 3.9.6 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg></span>
  <div><b>פנייה חדשה מהאתר</b><span>סתימה בכיור · חדרה · דנה<br><em>קיבלה מענה תוך שניות ✓✓</em></span></div>
</div>

<svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M5 2l14 10-6.5 1.2L16 21l-3 1.3-3.5-7.6L5 19z" fill="#fff" stroke="#1d1b2e" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
  // DATA (looks, palettes, the variants to show) is set by scripts/hero-video.mjs before run().
  const $ = (id) => document.getElementById(id);
  const S = window.hero = {};
  let cur = null;
  S.setup = (data) => {
    S.data = data;
    for (const v of data.variants) {
      for (const [box, w] of [["bview", "d"], ["pview", "m"]]) {
        const f = document.createElement("iframe"); f.src = `/__v/${v}.html`; f.dataset.v = v; f.dataset.w = w; f.tabIndex = -1; $(box).append(f);
      }
    }
    $("looks").innerHTML = data.looks.map((l) => `<div class="look" data-l="${l.id}">${l.label}</div>`).join("");
  };
  function pals(look) {
    const l = S.data.looks.find((x) => x.id === look);
    $("pals").innerHTML = l.palettes.map((p) => `<div class="pal" data-p="${p.id}" style="background:${p.c}"></div>`).join("");
    const el = $("pals"); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
  }
  S.show = (v) => {
    const [look, pal] = v.split("-");
    if (!cur || cur.split("-")[0] !== look) pals(look);
    document.querySelectorAll("iframe").forEach((f) => f.classList.toggle("on", f.dataset.v === v));
    document.querySelectorAll(".look").forEach((e) => e.classList.toggle("on", e.dataset.l === look));
    document.querySelectorAll(".pal").forEach((e) => e.classList.toggle("on", e.dataset.p === pal));
    cur = v;
  };
  // The cursor glides to the pill or the colour, and clicks.
  S.target = (v, kind) => {
    const [look, pal] = v.split("-");
    const el = kind === "look" ? document.querySelector(`.look[data-l="${look}"]`) : document.querySelector(`.pal[data-p="${pal}"]`);
    const r = el.getBoundingClientRect();
    $("cursor").style.left = r.left + r.width / 2 - 6 + "px"; $("cursor").style.top = r.top + r.height / 2 - 4 + "px";
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  S.click = (p) => { const d = document.createElement("div"); d.className = "ripple"; d.style.left = p.x + "px"; d.style.top = p.y + "px"; document.body.append(d); setTimeout(() => d.remove(), 700); };
  S.rest = () => { $("cursor").style.left = "640px"; $("cursor").style.top = "900px"; };
  S.notif = (on) => $("notif").classList.toggle("on", on);
  S.scroll = (y) => document.querySelectorAll("#pview iframe").forEach((f) => { try { f.contentWindow.scrollTo({ top: y, behavior: "smooth" }); } catch (e) {} });
</script>
</body>
</html>
