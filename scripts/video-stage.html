<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>stage</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* The stage for scripts/process-video.mjs: 1920x1080. The real site runs in the iframe "app"; everything else
     (the hook, the titles, the step rail, the camera, the arrow, the cards, the phone, the prices) is drawn here.
     Titles are big on purpose: the film has to read on a phone, with the sound off. */
  :root { --plum: #3a17b0; --plum-2: #17112e; --ink: #17112e; --slate: #4a4462; --mist: #f1edfd; --paper: #fcfbff; --mint: #5428e0; --mint-2: #e4dcfb; --line: #d8d6e3; --fuchsia: #c2136f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(1200px 700px at 30% 40%, #fcfbff, #ebe5fc); color: var(--ink); font-family: Rubik, system-ui, sans-serif; }
  .dot { color: var(--fuchsia); }

  /* top: the brand and the ten steps */
  .top { position: absolute; inset: 0 0 auto 0; height: 118px; display: flex; align-items: center; gap: 36px; padding: 0 48px; background: var(--plum); color: #fff; }
  .brand { flex: none; display: grid; gap: 2px; }
  .brand b { font: 900 36px/1 Rubik; letter-spacing: -.01em; }
  .brand small { font: 500 18px Rubik; color: #d8d6e3; }
  .rail { flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; transition: opacity .3s; }
  .rail li { position: relative; display: grid; gap: 6px; justify-items: center; color: #b9addf; font: 500 19px Rubik; transition: color .3s; }
  .rail li i { width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
  .rail li i::after { content: ""; display: block; height: 100%; width: 0; background: var(--mint-2); transition: width .45s cubic-bezier(.65,0,.35,1); }
  .rail li span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .rail li em { font: 700 15px Rubik; font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
  .rail li.done { color: #ebe5fc; } .rail li.done i::after { width: 100%; } .rail li.done em { background: var(--mint); color: #fff; }
  .rail li.on { color: #fff; } .rail li.on i::after { width: 50%; } .rail li.on em { background: var(--mint-2); color: var(--plum-2); }
  .rail li.on span { font-weight: 700; }
  /* in the montage the rail gives way to one line */
  .gets { position: absolute; inset: 0 auto 0 48px; display: flex; align-items: center; gap: 14px; font: 700 30px Rubik; color: #fff; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .gets i { font-style: normal; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.14); font: 700 22px Rubik; color: var(--mint-2); }
  body.montage .rail { opacity: 0; } body.montage .gets { opacity: 1; }

  /* the browser window with the real site */
  .device { position: absolute; left: 48px; top: 150px; width: 1240px; border-radius: 18px; background: #fff; box-shadow: 0 40px 90px -40px rgba(42,24,48,.55), 0 0 0 1px rgba(42,24,48,.08); overflow: hidden; }
  .chrome { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #f6f3ff; border-bottom: 1px solid var(--line); direction: ltr; }
  .dots { display: flex; gap: 7px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: #d8d6e3; }
  .url { flex: 1; height: 30px; border-radius: 15px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 500 17px Rubik; color: var(--slate); }
  .url svg { width: 14px; height: 14px; flex: none; }
  .url b { color: var(--ink); font-weight: 500; }
  .view { position: relative; width: 1240px; height: 775px; overflow: hidden; background: #fff; }
  .cam { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; transition: transform .6s cubic-bezier(.65,0,.35,1); will-change: transform; }
  .cam iframe { width: 1280px; height: 800px; border: 0; display: block; background: #fff; }
  .dim { position: absolute; inset: 0; pointer-events: none; background: rgba(23,17,46,0); transition: background .35s; }
  .dim.on { background: rgba(23,17,46,.55); }

  /* the titles, beside the window: what this step is, in a few big words, and what happens right now */
  .panel { position: absolute; right: 48px; top: 150px; width: 560px; height: 821px; display: flex; flex-direction: column; gap: 22px; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: var(--plum); color: #fff; font: 700 24px Rubik; }
  .chip b { font-weight: 900; color: var(--mint-2); }
  .panel h1 { margin: 0; font: 900 92px/1 Rubik; letter-spacing: -.025em; color: var(--plum-2); text-wrap: balance; }
  .panel .text { margin: 0; font: 500 36px/1.3 Rubik; color: #3a3650; text-wrap: balance; }
  .now { margin-top: auto; display: grid; gap: 8px; padding: 22px 24px; border-radius: 20px; background: #fff; box-shadow: 0 18px 40px -26px rgba(42,24,48,.5); border-inline-start: 8px solid var(--mint); }
  .now b { font: 700 40px/1.25 Rubik; color: var(--ink); min-height: 1.25em; text-wrap: balance; }
  .now.empty { visibility: hidden; }
  .now.flash { animation: flash .35s ease-out; }
  @keyframes flash { 0% { transform: translateX(-14px); opacity: .2; } 100% { transform: none; opacity: 1; } }
  .sample { align-self: flex-start; display: none; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--fuchsia); color: var(--fuchsia); font: 700 24px Rubik; background: #fff; }
  .sample::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--fuchsia); }
  body.montage .sample { display: inline-flex; }
  .swap { animation: swap .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes swap { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  /* the hand: an arrow that glides to the next thing to press, a ring on it, a ripple on the tap */
  .arrow { position: absolute; z-index: 20; width: 74px; height: 74px; pointer-events: none; opacity: 0; transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1), opacity .2s; filter: drop-shadow(0 8px 14px rgba(0,0,0,.35)); }
  .arrow.on { opacity: 1; } .arrow svg { width: 100%; height: 100%; animation: bob .45s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(var(--by, 9px)); } }
  .glow { position: absolute; z-index: 19; pointer-events: none; border-radius: 16px; box-shadow: 0 0 0 4px var(--mint), 0 0 0 14px rgba(84,40,224,.22); opacity: 0; transition: opacity .2s, left .3s, top .3s, width .3s, height .3s; }
  .glow.on { opacity: 1; }
  .tap { position: absolute; z-index: 21; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--mint); background: rgba(84,40,224,.22); pointer-events: none; animation: tap .5s ease-out forwards; }
  @keyframes tap { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  .bubble { position: absolute; z-index: 22; max-width: 460px; padding: 12px 20px; border-radius: 14px; background: var(--plum-2); color: #fff; font: 700 30px/1.25 Rubik; box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
  .bubble.on { opacity: 1; transform: none; }

  /* the step card that sweeps over the window when a step starts */
  .card { position: absolute; z-index: 15; left: 48px; top: 150px; width: 1240px; height: 821px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, var(--mint), var(--plum-2)); color: #fff; text-align: center; clip-path: inset(0 0 0 100%); transition: clip-path .4s cubic-bezier(.65,0,.35,1); }
  .card.on { clip-path: inset(0 0 0 0); }
  .card.off { clip-path: inset(0 100% 0 0); }
  .card .n { font: 900 230px/0.9 Rubik; color: var(--mint-2); letter-spacing: -.04em; }
  .card h2 { margin: 10px 0 0; font: 900 110px/1 Rubik; letter-spacing: -.025em; }
  .card p { margin: 22px 0 0; font: 500 40px Rubik; color: #e4dcfb; }

  /* a phone, for the WhatsApp messages */
  .phone { position: absolute; z-index: 16; left: 433px; top: 140px; width: 470px; height: 900px; border-radius: 54px; background: #121016; padding: 14px; box-shadow: 0 50px 100px -40px rgba(0,0,0,.7); transform: translateY(120%); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .phone.on { transform: none; }
  .phone .scr { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #efe7de; display: flex; flex-direction: column; }
  .phone .bar { background: #075e54; color: #fff; padding: 46px 18px 14px; display: flex; align-items: center; gap: 12px; }
  .phone .av { width: 46px; height: 46px; border-radius: 50%; background: var(--mint-2); color: var(--plum-2); display: grid; place-items: center; font: 900 21px Rubik; }
  .phone .bar b { display: block; font: 700 22px Rubik; } .phone .bar small { font: 400 15px Rubik; opacity: .85; }
  .phone .msgs { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; }
  .phone .m { align-self: flex-start; max-width: 90%; background: #fff; border-radius: 4px 14px 14px 14px; padding: 10px 14px 6px; font: 400 22px/1.42 Rubik; color: #111; box-shadow: 0 1px 1px rgba(0,0,0,.12); opacity: 0; transform: translateY(10px) scale(.98); transition: opacity .25s, transform .25s; white-space: pre-line; }
  .phone .m.me { align-self: flex-end; background: #d9fdd3; border-radius: 14px 4px 14px 14px; }
  .phone .m.on { opacity: 1; transform: none; }
  .phone .m time { display: block; text-align: left; font-size: 13px; color: #8a8a8a; margin-top: 4px; }
  .phone .m img { display: block; width: 100%; border-radius: 8px; margin: 2px 0 8px; aspect-ratio: 4 / 3; object-fit: cover; }
  .phone .btns { display: flex; border-top: 1px solid #eee; margin: 8px -14px 0; }
  .phone .btn { flex: 1; display: block; text-align: center; padding: 10px 4px; color: #0a7cff; font: 700 20px Rubik; }
  .phone .btn + .btn { border-inline-start: 1px solid #eee; }
  .phone .btn.hit { background: #e8f1ff; }

  /* the hook and the end: the whole stage */
  .full { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(1400px 900px at 60% 30%, #3a17b0, var(--plum-2)); color: #fff; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; overflow: hidden; }
  .full.on { opacity: 1; }
  .full.cut { transition: none; }
  .slides { position: absolute; inset: 0; }
  .slides img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; opacity: 0; }
  .slides img.on { opacity: 1; animation: kb 1.6s linear forwards; }
  @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.07); } }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,17,46,.55), rgba(58,23,176,.78) 55%, rgba(23,17,46,.92)); }
  .full .lines { position: relative; display: grid; gap: 24px; justify-items: center; padding: 0 80px; }
  .full .l { opacity: 0; transform: translateY(30px) scale(.97); transition: opacity .3s, transform .35s cubic-bezier(.2,.8,.2,1); }
  .full .l.on { opacity: 1; transform: none; }
  .full .l.gone { opacity: 0; transform: translateY(-30px); }
  .full .huge { font: 900 150px/1.02 Rubik; letter-spacing: -.035em; text-wrap: balance; text-shadow: 0 8px 40px rgba(23,17,46,.45); }
  .full .big { font: 900 112px/1 Rubik; letter-spacing: -.03em; }
  .full .mid { font: 700 64px/1.2 Rubik; color: var(--mint-2); }
  .full .small { font: 500 40px/1.35 Rubik; color: #e4dcfb; }
  .full .tagline { font: 700 34px Rubik; color: var(--mint-2); letter-spacing: .02em; }
  .full .stack { display: grid; place-items: center; }
  .full .stack > * { grid-area: 1 / 1; }
  .full .plans { display: grid; grid-template-columns: repeat(2, 680px); gap: 40px; margin-top: 10px; }
  .full .plans.one { grid-template-columns: 900px; }
  .full .plan { position: relative; display: grid; gap: 12px; justify-items: start; text-align: start; padding: 40px 46px; border-radius: 28px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  .full .plan.rec { background: #fff; color: var(--ink); box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .full .plan .tag { position: absolute; top: -24px; inset-inline-end: 36px; padding: 8px 22px; border-radius: 999px; background: var(--fuchsia); color: #fff; font: 700 30px Rubik; }
  .full .plan h3 { margin: 0; font: 900 72px/1 Rubik; }
  .full .plan .p { font: 900 104px/1 Rubik; letter-spacing: -.02em; }
  .full .plan .p small { font: 500 38px Rubik; letter-spacing: 0; }
  .full .plan .m { font: 700 52px Rubik; color: var(--mint-2); }
  .full .plan.rec .m { color: var(--mint); }
  .full .plan .w { font: 500 32px/1.3 Rubik; color: #d8d6e3; }
  .full .plan.rec .w { color: var(--slate); }
  .full .fine { font: 500 38px Rubik; color: #e4dcfb; }
  /* the end holds for reading, so it keeps moving a little */
  .full .lines.drift { animation: drift 6s linear forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }
  .full .cta.l.on { animation: glow 1.4s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 18px rgba(84,40,224,.18), 0 24px 70px -14px rgba(84,40,224,1); } }
  .full .cta { display: inline-flex; align-items: center; gap: 18px; padding: 26px 52px; border-radius: 999px; background: var(--mint); font: 900 58px Rubik; box-shadow: 0 0 0 10px rgba(84,40,224,.28), 0 24px 60px -18px rgba(84,40,224,.9); }
  .full .addr { font: 700 40px Rubik; color: #fff; direction: ltr; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Multi Landing</b><small>אתרים שבונים עסקים</small></div>
  <ol class="rail" id="rail"></ol>
  <div class="gets" aria-hidden="true"><i>אחרי שהאתר באוויר</i>מה האתר עושה בשבילכם</div>
</header>

<section class="device" id="device">
  <div class="chrome"><span class="dots"><i></i><i></i><i></i></span>
    <div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="#5428e0" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="url"></span></div>
  </div>
  <div class="view" id="view"><div class="cam" id="cam"><iframe name="app" id="app" title="האתר"></iframe></div><div class="dim" id="dim"></div></div>
</section>

<aside class="panel" id="panel">
  <div class="chip" id="chip"></div>
  <div class="sample" id="sample">המחשה · הפרטים והמספרים לדוגמה</div>
  <h1 id="title"></h1>
  <p class="text" id="text"></p>
  <div class="now empty" id="nowBox"><b id="now"></b></div>
</aside>

<div class="card" id="card"><div><div class="n" id="cardN"></div><h2 id="cardT"></h2><p id="cardS"></p></div></div>

<div class="phone" id="phone"><div class="scr">
  <div class="bar"><span class="av" id="phAv">E</span><div><b id="phName">Multi Landing</b><small id="phSub">וואטסאפ</small></div></div>
  <div class="msgs" id="msgs"></div>
</div></div>

<div class="arrow" id="arrow"><svg viewBox="0 0 48 48"><path d="M24 44 L10 26 H19 V4 H29 V26 H38 Z" fill="#5428e0" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>
<div class="glow" id="glow"></div>
<div class="bubble" id="bubble"></div>

<div class="full" id="full"><div class="slides" id="slides"></div><div class="shade" id="shade"></div><div class="lines" id="lines"></div></div>

<script>
  const STEPS = ["תחום", "דמו", "בונה", "תבנית", "צבעים", "שאלות", "תמונות", "בדיקה", "אישור", "באוויר"];
  const $ = (id) => document.getElementById(id);
  $("rail").innerHTML = STEPS.map((s, i) => `<li><i></i><span><em>${i + 1}</em>${s}</span></li>`).join("");
  const S = window.stage = {};
  // A title's last full stop is the house's one ornament: fuchsia.
  const dotted = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\.$/, '<span class="dot">.</span>');
  S.dotted = dotted;

  // The address bar shows the real address of the page in the window.
  const SHOW = (u) => {
    if (u.pathname.startsWith("/__live")) return "<b>oren-mayim.multilanding.co.il</b>" + u.pathname.replace(/^\/__live\/?/, "/").replace(/^\/$/, "");
    return "service-pro-web.netlify.app<b>" + u.pathname.replace(/index\.html$/, "") + "</b>";
  };
  setInterval(() => { try { const u = new URL($("app").contentWindow.location.href); if (u.protocol.startsWith("http")) $("url").innerHTML = SHOW(u); } catch (e) {} }, 100);

  const swap = (...ids) => { for (const id of ids) { const e = $(id); e.classList.remove("swap"); void e.offsetWidth; e.classList.add("swap"); } };
  // A step of the build: the rail, the chip, the title and one short line.
  S.step = (n, title, text) => {
    document.body.classList.remove("montage");
    document.querySelectorAll("#rail li").forEach((li, i) => { li.className = i + 1 < n ? "done" : i + 1 === n ? "on" : ""; });
    $("chip").innerHTML = `שלב <b>${n}</b> מתוך 10`;
    $("title").innerHTML = dotted(title); $("text").textContent = text || "";
    $("now").textContent = ""; $("nowBox").classList.add("empty");
    swap("chip", "title", "text");
  };
  // A feature in "what you get": the same panel, with the "sample" badge.
  S.feature = (n, of, title, text) => {
    document.body.classList.add("montage");
    $("chip").innerHTML = `מה מקבלים <b>${n}</b> מתוך ${of}`;
    $("title").innerHTML = dotted(title); $("text").textContent = text || "";
    $("now").textContent = ""; $("nowBox").classList.add("empty");
    swap("chip", "title", "text");
  };
  S.now = (t) => { const b = $("nowBox"); $("now").textContent = t; b.classList.toggle("empty", !t); b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); };
  S.allDone = () => document.querySelectorAll("#rail li").forEach((li) => { li.className = "done"; });

  S.card = (n, title, sub) => { const c = $("card"); $("cardN").textContent = n; $("cardT").innerHTML = dotted(title); $("cardS").textContent = sub || ""; c.className = "card"; void c.offsetWidth; c.classList.add("on"); };
  S.uncard = () => { const c = $("card"); c.classList.add("off"); setTimeout(() => { c.className = "card"; }, 450); };

  S.cam = (tx, ty, s) => { $("cam").style.transform = `translate(${tx}px, ${ty}px) scale(${s})`; };
  S.dim = (on) => $("dim").classList.toggle("on", !!on);

  S.point = (r, say) => {
    const a = $("arrow"), g = $("glow"), up = r.top < 260;
    a.style.left = r.left + r.width / 2 - 37 + "px"; a.style.top = (up ? r.bottom + 10 : r.top - 82) + "px";
    a.style.setProperty("--by", up ? "-9px" : "9px"); a.querySelector("svg").style.rotate = up ? "180deg" : "0deg";
    Object.assign(g.style, { left: r.left - 7 + "px", top: r.top - 7 + "px", width: r.width + 14 + "px", height: r.height + 14 + "px", borderRadius: Math.min(20, r.height / 2 + 7) + "px" });
    a.classList.add("on"); g.classList.add("on");
    const b = $("bubble");
    if (say) {
      b.textContent = say; b.classList.add("on");
      const bw = b.offsetWidth, bh = b.offsetHeight;
      let x = r.left + r.width / 2 - bw / 2; x = Math.max(60, Math.min(1270 - bw, x));
      const y = up ? r.bottom + 92 : r.top - 92 - bh;
      b.style.left = x + "px"; b.style.top = Math.max(130, y) + "px";
    } else b.classList.remove("on");
  };
  S.unpoint = () => { $("arrow").classList.remove("on"); $("glow").classList.remove("on"); $("bubble").classList.remove("on"); };
  S.tap = (x, y) => { const d = document.createElement("div"); d.className = "tap"; d.style.left = x + "px"; d.style.top = y + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 550); };

  S.phone = (on, name, av, sub) => {
    if (name) { $("phName").textContent = name; $("phAv").textContent = av || name[0]; $("phSub").textContent = sub || "וואטסאפ"; }
    if (on && name) $("msgs").innerHTML = "";
    $("phone").classList.toggle("on", on); S.dim(on);
  };
  S.msg = (html, me) => { const m = document.createElement("div"); m.className = "m" + (me ? " me" : ""); m.innerHTML = html; $("msgs").append(m); requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add("on"))); };
  S.hit = (label) => { const b = [...document.querySelectorAll("#msgs .btn")].reverse().find((x) => x.textContent === label); if (!b) return null; b.classList.add("hit"); const r = b.getBoundingClientRect(); S.tap(r.left + r.width / 2, r.top + r.height / 2); return true; };

  // The whole stage: the hook over flashes of real demo sites, and the end.
  S.full = (on, cut) => { const f = $("full"); f.classList.toggle("cut", !!cut); f.classList.toggle("on", on); };
  S.slides = (srcs) => { $("slides").innerHTML = srcs.map((s) => `<img src="${s}" alt="">`).join(""); $("shade").hidden = !srcs.length; };
  S.slide = (n) => document.querySelectorAll("#slides img").forEach((im, i) => im.classList.toggle("on", i === n));
  S.lines = (html, drift) => { const l = $("lines"); l.innerHTML = html; l.classList.remove("drift"); if (drift) { void l.offsetWidth; l.classList.add("drift"); } };
  S.show = (sel) => document.querySelectorAll("#lines " + sel).forEach((e) => e.classList.add("on"));
  S.showN = (sel, n) => { const e = document.querySelectorAll("#lines " + sel)[n]; if (e) e.classList.add("on"); };
  S.goneN = (sel, n) => { const e = document.querySelectorAll("#lines " + sel)[n]; if (e) { e.classList.remove("on"); e.classList.add("gone"); } };
</script>
</body>
</html>
