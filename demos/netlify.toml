# One Netlify site for the portfolio page and its demos (base directory: demos).
[build]
  publish = "."

[[headers]]
  for = "/leads-demo/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/ai-agent/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/plumber/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/movers/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/trainer/*"
  [headers.values]
    X-Robots-Tag = "noindex"
