# One Netlify site for the portfolio page and its demos (base directory: demos).
[build]
  publish = "."
  command = "echo 'static demo site, nothing to build'"

# Netlify auto-attached its Next.js plugin when it first saw the repo root. This site is static, so skip it.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# The AI chat on the hub (demos/shared/aibot.js) calls this function at /api/chat.
# It needs ANTHROPIC_API_KEY in Site configuration > Environment variables; without it the chat runs in scripted demo mode.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/leads-demo/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

