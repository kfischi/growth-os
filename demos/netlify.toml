# The owner's lead panel: never indexed, never cached, never framed.
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# The site builder: the owner's page, and כפיר's page. Not for search engines.
[[headers]]
  for = "/build/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

